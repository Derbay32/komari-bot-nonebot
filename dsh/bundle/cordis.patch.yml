# komari-bot private DSH composition.
#
# This is the complete allowlisted tree over an empty root. It deliberately
# does NOT inherit dsh-base, sdk-minimal, sdk-app, headless, or web bundles:
# those add forbidden tools, persistence, telemetry, upload, or endpoints.
#
# Bundle/profile patches apply above this list, so operator settings persist in
# the profile's own cordis.patch.yml. The profile is under DATA_DIR/dsh.

- insert:
    # --- kernel services -------------------------------------------------
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        # The task's frozen project prompt is registered as a scoped persona
        # section at Agent setup. Harness identity/runtime context stay off.
        includeHarnessIdentity: false
        includeRuntimeContext: false

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        # No independent repair retry loops. The official compressor still
        # performs its normal native context management and auxiliary calls.
        compactionRetries: 0
        maxOverflowRetries: 0

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    # --- persistence and settings ---------------------------------------
    # Credentials live explicitly inside the private profile directory.
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'
      config:
        path: !!js dshHomePath('.credentials.yaml')

    - id: settings
      name: '@deepseek-ai/dsh-settings'

    - id: config-editor
      name: '@deepseek-ai/dsh-config-editor'

    # --- official model adapter -----------------------------------------
    # Dormant until settings supply provider routes. No model call is made at
    # startup: routes are user configuration, not a shipped connection.
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'

    # --- presets ---------------------------------------------------------
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: chat

    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat
        name: Chat
        plugins: []

    - id: preset-summary
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: summary
        name: Summary
        plugins: []

    # --- project runtime -------------------------------------------------
    # This row id is the settings namespace `komari-agent`. Its chat and
    # summary binding/prompt fields are declared volatile for TSK-202.
    - id: komari-agent
      name: '@komari-bot/dsh-runtime/business'
      config:
        chat: {}
        summary: {}
