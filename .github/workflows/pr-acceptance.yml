name: PR 全量验收

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_NO_INTERACTION: "1"

jobs:
  static-and-unit:
    # main/dev ruleset 依赖该检查名；重命名时必须同步更新 required checks。
    name: 静态与无服务验收
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装 Poetry
        run: python -m pip install --no-cache-dir "poetry==${POETRY_VERSION}"

      - name: 恢复 Poetry 依赖缓存
        uses: actions/cache@v5
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-python-3.13-poetry-${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.13-poetry-${{ env.POETRY_VERSION }}-

      - name: 校验 lock 与 pyproject 一致
        id: lock-check
        run: poetry check --lock

      - name: 同步开发依赖
        id: dependency-sync
        if: ${{ !cancelled() }}
        run: poetry sync --with dev --no-root --no-ansi

      - name: Ruff 检查
        if: ${{ !cancelled() && steps.dependency-sync.outcome == 'success' }}
        run: poetry run ruff check .

      - name: Pyright 检查
        if: ${{ !cancelled() && steps.dependency-sync.outcome == 'success' }}
        run: poetry run pyright

      - name: 无服务全量测试
        if: ${{ !cancelled() && steps.dependency-sync.outcome == 'success' }}
        run: poetry run pytest tests/ -q -m "not group_admission_service"

  service-and-migration:
    # main/dev ruleset 依赖该检查名；重命名时必须同步更新 required checks。
    name: 真实服务与迁移验收
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: komari_bot
          POSTGRES_PASSWORD: komari_bot_ci
          POSTGRES_DB: komari_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U komari_bot -d komari_bot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://komari_bot:komari_bot_ci@localhost:5432/komari_bot
      KOMARI_TEST_POSTGRES_URL: postgresql+asyncpg://komari_bot:komari_bot_ci@localhost:5432/komari_bot
      KOMARI_TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装 Poetry
        run: python -m pip install --no-cache-dir "poetry==${POETRY_VERSION}"

      - name: 恢复 Poetry 依赖缓存
        uses: actions/cache@v5
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-python-3.13-poetry-${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-3.13-poetry-${{ env.POETRY_VERSION }}-

      - name: 校验 lock 与 pyproject 一致
        id: lock-check
        run: poetry check --lock

      - name: 同步开发依赖
        id: dependency-sync
        if: ${{ !cancelled() }}
        run: poetry sync --with dev --no-root --no-ansi

      - name: 应用迁移 upgrade head
        id: migration-upgrade
        if: ${{ !cancelled() && steps.dependency-sync.outcome == 'success' }}
        run: poetry run python -m komari_bot.db.orm_bootstrap upgrade head

      - name: 真实服务全量测试
        if: ${{ !cancelled() && steps.migration-upgrade.outcome == 'success' }}
        run: poetry run pytest tests/ -q -m "group_admission_service or not group_admission_service"

      - name: autogenerate 空 diff 校验
        if: ${{ !cancelled() && steps.migration-upgrade.outcome == 'success' }}
        run: poetry run python -m komari_bot.db.orm_bootstrap check
