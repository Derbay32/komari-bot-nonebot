name: Bug 反馈
title: "[Bug] "
description: 提交 Bug 反馈以帮助我们改进代码
labels: ["bug"]
body:
  - type: checkboxes
    id: terms
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过已有 Issue
          required: true
        - label: 我确认我的问题是独一无二的
          required: true
        - label: 我已经提供了该问题的完整说明与日志
          required: true

  - type: input
    id: env-bot-ver
    attributes:
      label: komari-bot 版本
      description: 填写 komari-bot 版本
      placeholder: e.g. 2.0.0
    validations:
      required: true

  - type: input
    id: env-protocol
    attributes:
      label: Onebot V11 协议端
      description: 填写连接 komari-bot 的 Onebot V11 协议端及版本
      placeholder: e.g. NapCat 4.18.13
    validations:
      required: true

  - type: textarea
    id: describe
    attributes:
      label: 描述问题
      description: 清晰简洁地说明问题是什么
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 提供能复现此问题的详细操作步骤
      placeholder: |
        1. 首先……
        2. 然后……
        3. 发生……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的结果
      description: 清晰简洁地描述你期望发生的事情

  - type: textarea
    id: logs
    attributes:
      label: 截图或日志
      description: 提供有助于诊断问题的任何日志和截图