name: Feat 请求
description: 提交新的功能或改进建议
title: '[FEAT] '
labels: ["feature"]
body:
  - type: checkboxes
    id: terms
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过已有 Issue
          required: true
        - label: 我确认我的需求是独一无二的
          required: true
        - label: 我已经提供了该功能建议的完整说明
          required: true

  - type: input
    id: env-bot-ver
    attributes:
      label: komari-bot 版本
      description: 填写 komari-bot 版本
      placeholder: e.g. 2.0.0
    validations:
      required: true

  - type: input
    id: env-protocol
    attributes:
      label: Onebot V11 协议端
      description: 填写连接 komari-bot 的 Onebot V11 协议端及版本
      placeholder: e.g. NapCat 4.18.13
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: 功能描述
      description: 请详细描述你希望添加的功能或改进
    validations:
      required: true

  - type: textarea
    id: feature-reason
    attributes:
      label: 需求理由
      description: 请说明为什么需要这个功能，解决了什么问题
    validations:
      required: true

  - type: textarea
    id: feature-expected
    attributes:
      label: 期望实现效果
      description: 请描述你期望的功能实现方式或最终效果

  - type: textarea
    id: other-info
    attributes:
      label: 其他补充信息
      description: 还有什么信息需要补充？